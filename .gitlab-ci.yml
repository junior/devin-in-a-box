stages:
  - devin
  - consume

variables:
  DEVIN_IMAGE: "$CI_REGISTRY_IMAGE/devin-cli:$CI_COMMIT_SHA"
  DEVIN_PERMISSION_MODE: "accept-edits"

devin:
  stage: devin
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - test -n "$DEVIN_PROMPT"
    - test -f "$DEVIN_CREDENTIALS_FILE"
    - test -n "$DHI_USERNAME"
    - test -n "$DHI_PASSWORD"
    - printf '%s' "$DHI_PASSWORD" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
    - docker build --tag "$DEVIN_IMAGE" .
  script:
    - |
      docker run --rm \
        --user 0:0 \
        --volume "$CI_PROJECT_DIR:/workspace" \
        --volume "$DEVIN_CREDENTIALS_FILE:/run/secrets/devin-credentials.toml:ro" \
        --env DEVIN_CREDENTIALS_FILE=/run/secrets/devin-credentials.toml \
        --env DEVIN_PROMPT \
        --env DEVIN_MODEL \
        --env DEVIN_PERMISSION_MODE \
        --env DEVIN_OUTPUT_FILE=/workspace/devin-output.txt \
        --env DEVIN_EXPORT_FILE=/workspace/devin-conversation.json \
        "$DEVIN_IMAGE"
  artifacts:
    when: always
    paths:
      - devin-output.txt
      - devin-conversation.json
    expire_in: 1 week

# Example of passing Devin's response to a later job. Replace this job with
# your own consumer and keep the `needs` declaration.
consume_devin_output:
  stage: consume
  image: alpine:3.21
  needs:
    - job: devin
      artifacts: true
  script:
    - test -s devin-output.txt
    - cat devin-output.txt
