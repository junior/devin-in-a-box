name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate entrypoint
        run: bash -n docker-entrypoint.sh
      - name: Validate sandbox launcher
        run: bash -n scripts/devin-sandbox
      - name: Validate sandbox kit spec YAML
        run: python3 -c 'import sys, yaml; yaml.safe_load(open("sandbox-kit/spec.yaml"))'
      - name: Validate JSON
        run: jq empty devin-config.json sandbox-kit/files/home/.config/devin/config.json
