name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      SBX_VERSION: v0.42.1
      SBX_LINUX_AMD64_SHA256: fe46facba420d1cb8b1dad57d5b182d6df9dadd46c324c2ca3ef574fb7eada6f
    steps:
      - uses: actions/checkout@v7
      - name: Validate entrypoint
        run: bash -n docker-entrypoint.sh
      - name: Cache sbx kit validator
        id: cache-sbx
        uses: actions/cache@v5
        with:
          path: ~/.cache/sbx/${{ env.SBX_VERSION }}/sbx
          key: sbx-validator-linux-amd64-${{ env.SBX_VERSION }}
      - name: Install pinned sbx kit validator
        if: steps.cache-sbx.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/sbx.tar.gz"
          destination="$HOME/.cache/sbx/$SBX_VERSION"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/sbx-releases/releases/download/$SBX_VERSION/DockerSandboxes-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SBX_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          mkdir -p "$destination"
          tar -xzf "$archive" --strip-components=1 -C "$destination" docker-sbx/sbx
          chmod 755 "$destination/sbx"
      - name: Validate sandbox kit schema
        run: $HOME/.cache/sbx/$SBX_VERSION/sbx kit validate ./sandbox-kit
      - name: Validate JSON
        run: jq empty devin-config.json sandbox-kit/files/home/.config/devin/config.json
