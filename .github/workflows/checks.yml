name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate entrypoint
        run: bash -n docker-entrypoint.sh
      # A v3 kit is validated by building it: the docker/sandbox-kit:3 frontend
      # that the descriptor's first line names decodes the descriptor strictly
      # and fails the build on an unknown field or a bad value. sbx is no help
      # here: from 0.51, `sbx kit validate` needs a Docker sign-in, which a
      # pull request does not have, and with --offline it refuses a v3 source
      # kit ("no kit builder configured").
      - name: Validate sandbox kit
        run: docker buildx build sandbox-kit --file sandbox-kit/devin-in-a-box.yaml --output type=cacheonly
      - name: Validate JSON
        run: |
          jq empty devin-config.json
          jq -e '.auto_update == false' sandbox-kit/config.json >/dev/null
