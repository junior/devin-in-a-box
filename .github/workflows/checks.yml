name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate entrypoint
        run: bash -n docker-entrypoint.sh
      - name: Validate JSON
        run: jq empty devin-config.json
