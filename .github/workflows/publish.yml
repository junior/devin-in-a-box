name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Multi-platform image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devin-in-a-box
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          flavor: |
            latest=auto

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  kit:
    name: Docker Sandboxes kit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SBX_VERSION: v0.51.0
      # GitHub's digest for the release asset, which the asset's SLSA
      # provenance (DockerSandboxes-linux-amd64.provenance.json) names too.
      SBX_LINUX_AMD64_SHA256: 5d605d94dd297a796188aad4095a4a2f22368c8f270f2dac49f2ede453d4d3ec
      KIT_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devin-in-a-box-kit

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The v3 kit is built for both platforms and pushed with its provenance
      # and SBOM, which needs a builder that is not the plain docker driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install pinned sbx
        run: |
          archive="$RUNNER_TEMP/sbx.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/sbx-releases/releases/download/$SBX_VERSION/DockerSandboxes-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SBX_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sbx"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/sbx" docker-sbx/sbx
          echo "$RUNNER_TEMP/sbx" >> "$GITHUB_PATH"

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: "1.3.6"

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # sbx attaches the signature through its own session, not the Docker
      # credential store, and that session needs a Docker Hub token.
      - name: Sign in to Docker Hub with sbx
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | sbx login --username "$DOCKERHUB_USERNAME" --password-stdin

      # The build below validates the descriptor (the docker/sandbox-kit:3
      # frontend decodes it strictly); this only ties its version to the tag.
      - name: Check the kit version against the release tag
        run: |
          kit_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' sandbox-kit/devin-in-a-box.yaml)"
          if [ "$kit_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "sandbox-kit/devin-in-a-box.yaml version $kit_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # A v3 kit is an image: the descriptor rides in the manifest annotation
      # and the layers are the content, so one push publishes both. Build and
      # push once, then re-point latest by digest and sign that digest: every
      # build stamps a creation time, so a second build would mint a different
      # digest. A re-run reuses an already published version instead of
      # rebuilding it.
      - name: Publish signed kit
        run: |
          ref="$KIT_REPOSITORY:${GITHUB_REF_NAME#v}"
          digest="$(oras manifest fetch --descriptor "$ref" 2>/dev/null | jq -r '.digest // empty' || true)"
          if [ -n "$digest" ]; then
            echo "$ref is already published as $digest; signing it instead of rebuilding"
          else
            docker buildx build sandbox-kit \
              --file sandbox-kit/devin-in-a-box.yaml \
              --platform linux/amd64,linux/arm64 \
              --provenance mode=max \
              --sbom true \
              --tag "$ref" \
              --push \
              --metadata-file "$RUNNER_TEMP/kit-build.json"
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/kit-build.json")"
          fi
          oras tag "$KIT_REPOSITORY@$digest" latest
          sbx kit sign "$KIT_REPOSITORY@$digest"
          # Docker Hub can take a few seconds to list a signature it has just
          # stored: v0.4.0's verify, run 0.7s after signing, said "kit is not
          # signed" and passed a few minutes later. Retry for up to a minute;
          # a signature from any other identity still fails every attempt.
          for attempt in 1 2 3 4 5 6 7; do
            if sbx kit verify \
              --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$KIT_REPOSITORY@$digest"; then
              exit 0
            fi
            echo "verify attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          exit 1

      - name: Sign out of sbx
        if: always()
        run: sbx logout --force || true
