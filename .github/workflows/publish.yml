name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Multi-platform image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devin-in-a-box
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          flavor: |
            latest=auto

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  kit:
    name: Docker Sandboxes kit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SBX_VERSION: v0.46.0
      SBX_LINUX_AMD64_SHA256: edd86e2f21559e190723fd884c3a1dced161a555afdff85c5921ed45e7d6d56e
      KIT_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devin-in-a-box-kit

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned sbx
        run: |
          archive="$RUNNER_TEMP/sbx.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/sbx-releases/releases/download/$SBX_VERSION/DockerSandboxes-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SBX_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sbx"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/sbx" docker-sbx/sbx
          echo "$RUNNER_TEMP/sbx" >> "$GITHUB_PATH"

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: "1.3.3"

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # sbx attaches the signature through its own session, not the Docker
      # credential store, and that session needs a Docker Hub token.
      - name: Sign in to Docker Hub with sbx
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | sbx login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Validate kit against the release tag
        run: |
          sbx kit validate ./sandbox-kit
          kit_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' sandbox-kit/spec.yaml)"
          if [ "$kit_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "sandbox-kit/spec.yaml version $kit_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # Push once and re-point latest by digest: every push stamps a creation
      # time, so a second push would mint a different digest and signature.
      # A re-run reuses an already published version instead of re-pushing it.
      - name: Publish signed kit
        run: |
          ref="$KIT_REPOSITORY:${GITHUB_REF_NAME#v}"
          digest="$(oras manifest fetch --descriptor "$ref" 2>/dev/null | jq -r '.digest // empty' || true)"
          if [ -n "$digest" ]; then
            echo "$ref is already published as $digest; signing it instead of re-pushing"
            sbx kit sign "$KIT_REPOSITORY@$digest"
          else
            sbx kit push ./sandbox-kit "$ref" --sign
            digest="$(oras manifest fetch --descriptor "$ref" | jq -r .digest)"
          fi
          oras tag "$KIT_REPOSITORY@$digest" latest
          sbx kit verify \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$KIT_REPOSITORY@$digest"

      - name: Sign out of sbx
        if: always()
        run: sbx logout --yes || true
